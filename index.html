<!-- Modernist design tokens (Grand Tours hub only — see design_handoff_year_selection/). -->
<link rel="stylesheet" href="modernist.css">
<style>
  html,body{margin:0;padding:0;}
  body{min-height:100vh;display:flex;flex-direction:column;}
  a{color:var(--color-text);text-decoration:none;}
  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}

  .gt-header{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:16px;padding:18px 24px;border-bottom:2px solid var(--color-divider);
  }
  .gt-brand{
    font-family:var(--font-heading);font-weight:700;font-size:15px;
    letter-spacing:.14em;text-transform:uppercase;
  }
  .gt-langs{display:flex;gap:14px;}
  .langbtn{
    appearance:none;border:0;background:transparent;cursor:pointer;padding:0;
    font-family:var(--font-heading);font-size:13px;font-weight:600;letter-spacing:.12em;
    color:var(--color-neutral-700);
  }
  .langbtn.active{color:var(--color-accent);}
  .langbtn:hover{color:var(--color-accent-700);}

  main{flex:1;display:flex;flex-direction:column;}

  .gt-hero{padding:56px 24px 28px;display:flex;flex-direction:column;gap:14px;}
  .kicker{
    font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    color:var(--color-accent-700);
  }
  .gt-hero h1{
    margin:0;font-family:var(--font-heading);font-weight:700;
    font-size:clamp(44px,9vw,104px);line-height:.92;letter-spacing:-.02em;
  }

  .race-list{border-top:2px solid var(--color-divider);}
  .race{
    display:flex;align-items:center;justify-content:space-between;gap:24px;
    padding:24px;border-bottom:2px solid var(--color-divider);
    transition:background 120ms ease;
  }
  .race:hover{background:var(--color-accent-100);}
  .race-left{display:flex;align-items:center;gap:20px;min-width:0;}
  .race-num{
    flex:none;font-family:var(--font-heading);font-size:13px;font-weight:600;
    letter-spacing:.1em;color:var(--color-accent-700);
  }
  .race-flag{flex:none;width:30px;height:20px;}
  .race-name{
    font-family:var(--font-heading);font-size:clamp(20px,3.2vw,34px);
    font-weight:600;letter-spacing:-.01em;
  }
  .race-arrow{flex:none;font-size:24px;line-height:1;color:var(--color-accent-700);}

  .search-section{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,420px);
    align-items:end;gap:32px;padding:48px 24px 56px;
    border-bottom:2px solid var(--color-divider);background:var(--color-surface);
  }
  .search-section h2{
    margin:12px 0 10px;font-family:var(--font-heading);font-weight:700;
    font-size:clamp(28px,5vw,52px);line-height:1;letter-spacing:-.02em;
  }
  .search-section p{max-width:46ch;margin:0;line-height:1.5;color:var(--color-neutral-700);}
  .search-link{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    min-height:68px;padding:16px 18px;border:2px solid var(--color-text);
    background:var(--color-bg);font-weight:600;transition:background 120ms ease;
  }
  .search-link:hover{background:var(--color-accent-100);}
  .search-link .search-arrow{font-size:26px;line-height:1;color:var(--color-accent-700);}

  @media(max-width:720px){
    .search-section{grid-template-columns:1fr;gap:24px;padding-block:36px 40px;}
  }

  .gt-footer{
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding:32px 24px 40px;
  }
  .footer-note{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--color-neutral-700);
  }
  .footer-year{
    font-family:var(--font-heading);font-size:clamp(40px,8vw,88px);font-weight:700;
    line-height:.85;letter-spacing:-.03em;color:var(--color-accent);
  }
</style>
</head>
<body>
<header class="gt-header">
  <div class="gt-brand">Grand Tours</div>
  <div class="gt-langs" id="langSel" role="group" aria-label="Kieli / Language">
    <button class="langbtn" data-lang="fi" aria-label="Suomeksi" aria-pressed="false">FI</button>
    <button class="langbtn" data-lang="fr" aria-label="En français" aria-pressed="false">FR</button>
    <button class="langbtn" data-lang="en" aria-label="In English" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <div class="gt-hero">
    <span class="kicker" id="kicker"></span>
    <h1>Grand Tours</h1>
  </div>

  <!-- Race order per the design: Giro, Tour, Femmes, Vuelta. Links are
       scoped to the 2026 season folder — see design_handoff_year_selection/
       for the (currently hidden) year-picker screen that will front this
       once a second season's pages exist. -->
  <div class="race-list">
    <a class="race" href="2026/giro.html">
      <span class="race-left">
        <span class="race-num">01</span>
        <span class="race-flag" style="background:linear-gradient(to right, #008c45 0 33.33%, #f4f5f0 33.33% 66.66%, #cd212a 66.66% 100%)" aria-hidden="true"></span>
        <span class="race-name">Giro d&rsquo;Italia</span>
      </span>
      <span class="race-arrow">→</span>
    </a>
    <a class="race" href="2026/tdf.html">
      <span class="race-left">
        <span class="race-num">02</span>
        <span class="race-flag" style="background:linear-gradient(to right, #002395 0 33.33%, #f4f5f0 33.33% 66.66%, #ed2939 66.66% 100%)" aria-hidden="true"></span>
        <span class="race-name">Tour de France</span>
      </span>
      <span class="race-arrow">→</span>
    </a>
    <a class="race" href="2026/femmes.html">
      <span class="race-left">
        <span class="race-num">03</span>
        <span class="race-flag" style="background:linear-gradient(to right, #002395 0 33.33%, #f4f5f0 33.33% 66.66%, #ed2939 66.66% 100%)" aria-hidden="true"></span>
        <span class="race-name">Tour de France Femmes</span>
      </span>
      <span class="race-arrow">→</span>
    </a>
    <a class="race" href="2026/vuelta.html">
      <span class="race-left">
        <span class="race-num">04</span>
        <span class="race-flag" style="background:linear-gradient(to bottom, #aa151b 0 25%, #f1bf00 25% 75%, #aa151b 75% 100%)" aria-hidden="true"></span>
        <span class="race-name">Vuelta a España</span>
      </span>
      <span class="race-arrow">→</span>
    </a>
  </div>

  <section class="search-section" aria-labelledby="searchHeading">
    <div>
      <span class="kicker" id="searchKicker"></span>
      <h2 id="searchHeading"></h2>
      <p id="searchDescription"></p>
    </div>
    <a class="search-link" href="riders.html">
      <span id="searchLinkText"></span>
      <span class="search-arrow" aria-hidden="true">↗</span>
    </a>
  </section>
</main>

<footer class="gt-footer">
  <span class="footer-note" id="footerNote"></span>
  <span class="footer-year">2026</span>
</footer>

<script>
/* Language preference is shared with the individual tour pages via the same
   localStorage key, so a visitor's choice carries across the whole site. */
const LANG_KEY = 'tdf2026-lang';

const STRINGS = {
  fi: {
    kicker: 'Valitse kilpailu',
    searchKicker: 'Kuljettajahaku',
    searchHeading: 'Etsi ajaja.',
    searchDescription: 'Tutki ajajan kilpailuja ja etappisijoituksia yhdessä paikassa.',
    searchLink: 'Avaa ajajahaku',
    footer: 'Reitit · profiilit · tulokset',
  },
  en: {
    kicker: 'Pick a Grand Tour',
    searchKicker: 'Rider search',
    searchHeading: 'Find a rider.',
    searchDescription: 'Explore a rider’s races and stage placings in one place.',
    searchLink: 'Open rider search',
    footer: 'Routes · profiles · results',
  },
  fr: {
    kicker: 'Choisissez une course',
    searchKicker: 'Recherche de coureurs',
    searchHeading: 'Trouvez un coureur.',
    searchDescription: 'Explorez ses courses et ses classements d’étape au même endroit.',
    searchLink: 'Ouvrir la recherche',
    footer: 'Parcours · profils · résultats',
  },
};

function detectLang(){
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if(saved==='fi' || saved==='en' || saved==='fr') return saved;
  } catch (e) {}
  const nav = (navigator.language||'en').toLowerCase();
  if(nav.startsWith('fi')) return 'fi';
  if(nav.startsWith('fr')) return 'fr';
  return 'en';
}
let lang = detectLang();
function t(key){
  const v = STRINGS[lang][key];
  return v !== undefined ? v : STRINGS.en[key];
}

function render(){
  document.getElementById('kicker').textContent = t('kicker');
  document.getElementById('searchKicker').textContent = t('searchKicker');
  document.getElementById('searchHeading').textContent = t('searchHeading');
  document.getElementById('searchDescription').textContent = t('searchDescription');
  document.getElementById('searchLinkText').textContent = t('searchLink');
  document.getElementById('footerNote').textContent = t('footer');
  document.querySelectorAll('#langSel .langbtn').forEach(b=>{
    const active = b.dataset.lang===lang;
    b.classList.toggle('active', active);
    b.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
  document.documentElement.lang = lang;
}

document.querySelectorAll('#langSel .langbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    lang = btn.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    render();
  });
});

render();
</script>
<script data-goatcounter="https://grandtours.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>

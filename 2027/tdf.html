{n:1, dateIso:'2027-07-02', start:'Edinburgh', finish:'Carlisle', km:184, type:'flat', gain:2000,
 // Profile traced from the press-kit waypoints (relative height ≈ 15 + altitude/6).
 profile:[[0,27],[18,83],[36,41],[53,41],[61.8,32],[64,56],[90.5,39],[124.5,33],[150.5,17],[168,26],[184,18]],

   {name:{en:'Côte de Melrose'},km:64,len:2.2,grad:6.7,cat:null}
 ],
 sprints:[],
 desc:{
  fi:`<p>Avausetappi lähtee Skotlannin pääkaupungista etelään ja voi hyvin päättyä joukkokiriin, jolloin ensimmäinen keltainen paita menee sprintterille. Reitti kulkee maaseudun halki komeissa maisemissa ja kohoaa Broad Law'n kohdalla noin 400 metriin, mutta nousu tapahtuu enimmäkseen pitkinä loivina ylämäkinä. Ainoa luokiteltu nousu on Côte de Melrose (2,2 km, 6,7 %) 64 kilometrin kohdalla.</p><p>Loppuosa on tasainen: reitti ylittää rajan Skotlannista Englantiin ja päättyy Carlisleen lyhyelle loppusuoralle.</p>`,
  en:`<p>The opening stage heads south from the Scottish capital and could well end in a bunch sprint, handing the first yellow jersey to a sprinter. The route crosses open countryside with fine scenery and tops out at around 400 metres near Broad Law, but most of the climbing comes on long, gentle drags. The only categorised climb is the Côte de Melrose (2.2 km at 6.7%) at kilometre 64.</p><p>The run-in is flat: the race crosses the border from Scotland into England and finishes in Carlisle on a short home straight.</p>`,
  fr:`<p>L’étape d’ouverture file plein sud depuis la capitale écossaise et pourrait bien se conclure par un sprint massif, offrant le premier maillot jaune à un sprinteur. Le parcours traverse une campagne aux beaux paysages et culmine vers 400 m près de Broad Law, mais l’essentiel du dénivelé se fait sur de longs faux plats. La seule ascension répertoriée est la côte de Melrose (2,2 km à 6,7 %), au km 64.</p><p>Le final est plat : la course passe d’Écosse en Angleterre et se termine à Carlisle sur une courte ligne droite.</p>`
 }},

   {name:{en:'Côte de Parbold'},km:183,len:1.8,grad:5.6,cat:null}

 sprints:[],
 desc:{
  fi:`<p>Etappi alkaa Lake Districtin kansallispuistosta ja on etapin 3 ohella tämän Grand Départin pisin (223 km). Lancasterin (km 75) jälkeen maasto muuttuu kumpuilevaksi ja raskaammaksi aina Liverpoolin laitamille asti. Viisi luokiteltua nousua tekevät etapista oivan tilaisuuden karkureille.</p><p>Kestävät sprintterit voivat silti päästä peliin lopussa, joka on melko tasainen ja kulkee enimmäkseen taajama-alueella. Suurten yleisömassojen keskellä ajajien on oltava tarkkana etenkin alamäessä ennen viimeistä kilometriä.</p>`,
  en:`<p>The stage opens in the Lake District National Park and, at 223 km, shares the title of longest day of this Grand Départ. Beyond Lancaster (km 75) the terrain turns rolling and tougher all the way to the outskirts of Liverpool. Five categorised climbs make it an ideal day for the breakaway.</p><p>Resilient sprinters could still come back into play in a fairly flat finale that runs mostly through built-up areas. In front of what are sure to be huge crowds, the riders will need to stay alert, especially on the descent before the final kilometre.</p>`,
  fr:`<p>L’étape s’élance dans le parc national du Lake District et compte, avec 223 km, parmi les plus longues de ce Grand Départ. Après Lancaster (km 75), le terrain devient vallonné et plus exigeant jusqu’aux abords de Liverpool. Cinq côtes répertoriées en font un terrain idéal pour les baroudeurs.</p><p>Les sprinteurs les plus résistants pourraient toutefois revenir dans le jeu dans un final assez plat, tracé surtout en agglomération. Devant un public sans doute très nombreux, il faudra rester vigilant, notamment dans la descente qui précède la flamme rouge.</p>`
 }},

   {name:{en:'Côte de Caerffili'},km:210.5,len:2,grad:8.1,cat:null}

 sprints:[],
 desc:{
  fi:`<p>Kokonaan Walesissa ajettava etappi on raskas ja sen loppu räjähtävä — kokonaiskilpailun kärkinimet ja puncheurit joutuvat näyttämään kuntonsa. Ensimmäiset noin 80 kilometriä ovat helppoja, minkä jälkeen seuraa pitkiä ja välillä vaikeita nousuja, kuten Epynt (3,7 km, 7,9 %).</p><p>Noin 125 kilometrin jälkeen reitti tulee vanhalle kaivosalueelle, jossa mäet lyhenevät ja jyrkkenevät (Penrhys 10,1 %, Hengoed 11 %). Côte de Caerffili (2 km, 8,1 %) noin 12 km ennen maalia voi sytyttää kovan taistelun, johon suosikitkin joutuvat mukaan. Nopea loppu Cardiffin halki ohittaa 1000-luvun linnan ja Principality Stadiumin.</p>`,
  en:`<p>Raced entirely in Wales, this stage is both gruelling and explosive at the end, putting team leaders and punchier riders to the test. The first 80 or so kilometres are straightforward — a chance to warm the legs — before a run of long and sometimes difficult climbs such as the Epynt (3.7 km at 7.9%).</p><p>After about kilometre 125 the race enters the old coal-mining valleys, where the climbs get shorter and steeper (Penrhys at 10.1%, Hengoed at 11%). The Côte de Caerffili (2 km at 8.1%), some 12 km from the line, could spark a fierce fight that the favourites will struggle to stay out of. A very fast run through Cardiff passes close to the 11th-century castle and the Principality Stadium.</p>`,
  fr:`<p>Cette étape 100 % galloise s’annonce éprouvante, avec un final explosif qui mettra les leaders et les puncheurs à l’épreuve. Les quelque 80 premiers kilomètres, plutôt tranquilles, servent de mise en jambes avant une série de côtes longues et parfois difficiles, comme celle d’Epynt (3,7 km à 7,9 %).</p><p>À partir du km 125 environ, la course entre dans l’ancien bassin minier, où les ascensions deviennent plus courtes et plus raides (Penrhys à 10,1 %, Hengoed à 11 %). La côte de Caerffili (2 km à 8,1 %), à une douzaine de kilomètres de l’arrivée, pourrait déclencher une belle bagarre à laquelle les favoris auront du mal à échapper. La traversée très rapide de Cardiff passe près du château du XIe siècle et du Principality Stadium.</p>`
 }},

{n:4, dateIso:'2027-07-06', start:'Cherbourg-en-Cotentin', finish:'Cherbourg-en-Cotentin', km:171, type:'hilly',
 climbs:[
   {name:{en:'Côte du Becquet'},km:null,len:null,grad:null,cat:null}

 sprints:[],
 desc:{
  fi:`<p>Ensimmäisen lepopäivän jälkeen etappi kiertää Cherbourgin ympäristön rannikkomaisemia ja päättyy samaan kaupunkiin, josta se lähti. Merituuli tuo mukanaan sivutuuliriskin, joka voi pilkkoa kentän, jos joukkueet päättävät painaa kaasua.</p><p>Noin 10 km ennen maalia on lyhyt ja jyrkkä Côte du Becquet (noin 1 km). Se sopii puncheureille, mutta myös vahvat sprintterit voivat selvitä sen yli ja ratkaista etapin joukkokiriin.</p>`,
  en:`<p>After the first rest day the stage loops around the coast near Cherbourg and finishes in the town where it started. The sea breeze brings a crosswind risk that could split the bunch if the teams decide to push the pace.</p><p>About 10 km from the line comes the short, steep Côte du Becquet (roughly 1 km). It suits the puncheurs, but strong sprinters can get over it too and turn the day into a bunch finish.</p>`,
  fr:`<p>Après la première journée de repos, l’étape décrit une boucle le long de la côte autour de Cherbourg et s’achève dans la ville du départ. Le vent marin fait planer un risque de bordures, qui peut fractionner le peloton si les équipes accélèrent.</p><p>À environ 10 km de l’arrivée se dresse la côte du Becquet, courte et raide (environ 1 km). Elle convient aux puncheurs, mais les sprinteurs costauds peuvent aussi la franchir et transformer la journée en arrivée groupée.</p>`
 }},

{n:5, dateIso:'2027-07-07', start:'Pontorson', finish:'Plumelec', km:178, type:'hilly',
 climbs:[

 sprints:[],
 desc:{
  fi:`<p>Etappi ylittää Bretagnen rajan ja päättyy Plumelecin kukkuloille, missä loppukierros sisältää Côte de Cadoudalin (1,7 km, 6,2 %) kahdesti — toisen kerran maaliviivalle asti. Toistuva nousu karsii kentän, ja päivä kuuluu puncheureille.</p>`,
  en:`<p>The stage crosses into Brittany and ends in the hills around Plumelec, where the finishing circuit includes the Côte de Cadoudal (1.7 km at 6.2%) twice, the second time all the way to the line. The repeated climb wears the field down and the day belongs to the puncheurs.</p>`,
  fr:`<p>L’étape pénètre en Bretagne et se conclut sur les collines de Plumelec, où le circuit final comprend deux fois la côte de Cadoudal (1,7 km à 6,2 %), la seconde jusqu’à la ligne. Cette ascension répétée use le peloton et la journée appartient aux puncheurs.</p>`
 }},

{n:6, dateIso:'2027-07-08', start:'Vannes', finish:'Angers', km:193, type:'flat',
 climbs:[],
 sprints:[],
 desc:{
  fi:`<p>Tasainen etappi Bretagnesta Loiren laaksoon on selvä sprinttipäivä. Maali Angersissa nousee loppusuoralla hieman, joten pelkkä nopeus ei riitä, vaan sprintterin on jaksettava myös loppuun asti.</p>`,
  en:`<p>A flat run from Brittany to the Loire valley, this is a clear sprinters’ day. The finish in Angers rises slightly on the home straight, so raw speed is not enough and the winner will also need to last to the line.</p>`,
  fr:`<p>Étape plate entre la Bretagne et la vallée de la Loire, cette journée est clairement celle des sprinteurs. L’arrivée à Angers monte légèrement sur la ligne droite : la vitesse pure ne suffira pas, il faudra aussi tenir jusqu’au bout.</p>`
 }},

 sprints:[],
 desc:{
  fi:`<p>Loiren laakson yksilöaika-ajo on 38 km pitkä ja maastoltaan aaltoileva. Se päättyy Chambordin linnan pihaan, ja ensimmäiset suuret aikaerot kokonaiskilpailussa syntyvät todennäköisesti täällä.</p>`,
  en:`<p>The Loire Valley individual time trial is 38 km long over undulating terrain. It ends at the Château de Chambord, and the first big gaps in the general classification are likely to open up here.</p>`,
  fr:`<p>Le contre-la-montre individuel de la vallée de la Loire mesure 38 km sur un terrain ondulé. Il s’achève au château de Chambord, et les premiers gros écarts du classement général devraient se creuser ici.</p>`
 }},

 desc:{

/* ---------- ELEVATION PROFILE ----------
   Illustrative SVG built from stage.profile keypoints — monochrome ink
   line/fill with accent-shade climb bands and a dashed accent sprint flag,
   per the Modernist system (climb category colour is the only colour that
   changes; the stage-type colouring the old theme used is gone). */

let routesData = null, routesPromise = null;
let stageMap = null, stageMapFitBounds = null;
let mapExpanded = false; // persists across stage switches; renderPanel reflects it

/* ---------- RENDER STAGE LIST ---------- */
const listEl = document.getElementById('stageList');
let activeIdx = 0;
const raceStages = stages.filter(s=>s.n!=='lepo');

/* Keeps the stage-rail column exactly as tall as the detail panel next to
   it, copied straight from the panel's rendered height (see index.html's
   sibling comment in the previous version of this file for why this is
   done in JS rather than pure CSS). Skipped below the 980px breakpoint,
   where the layout drops to a single column. */
window.addEventListener('resize', ()=>{ syncStageListHeight(); positionPanel(); });

/* Below the 980px breakpoint the detail panel has no side column to live in,
   so it's moved into the stage list right after the selected stage's row —
   otherwise it renders below the entire list, far from the row that opened
   it. Above the breakpoint it moves back into its own grid column. */

/* ---------- WEATHER ----------
   Actual race-day weather loaded from data/2027/tdf2027-weather.json, fetched by
   scripts/fetch_weather.py (Open-Meteo's historical archive): the stage's
   start/finish-town daily high/low, not a specific-time reading, since that
   is what a historical archive actually gives you. Missing file/stage
   leaves the "no data" note. */
let WEATHER = null;

/* ---------- RENDER MAIN PANEL ---------- */
function renderPanel(stage){
  const panel = document.getElementById('panel');
  // Tear down any live map before its container is replaced by innerHTML.
  destroyStageMap();

  let climbRows = '';
  if(stage.climbs && stage.climbs.length){
    climbRows = stage.climbs.map(c=>`
      <tr>
        <td><span class="climbname"><span class="sq" style="background:${CAT_COLOR[c.cat]||CAT_COLOR.C1}"></span>${c.name[lang]||c.name.en}</span></td>
        <td class="num cat">${c.cat ? catLabel(c.cat) : '—'}</td>
        <td class="num">${c.len ? fmtKm(c.len) : '—'}</td>
        <td class="num">${c.grad ? c.grad+' %' : '—'}</td>
        <td class="loc">${c.km!=null ? 'km '+c.km : '—'}</td>
      </tr>`).join('');
  }

  let sprintRows = '';
  if(stage.sprints && stage.sprints.length){
    sprintRows = stage.sprints.map((s,i)=>`
      <tr>
        <td>${t('sprintChip')}${stage.sprints.length>1?' '+(i+1):''}</td>
        <td class="num">km ${s.km}</td>
        <td class="num">${s.pts} ${t('sprintPtsSuffix')}</td>
      </tr>`).join('');
  }

  const isTT = stage.type==='itt' || stage.type==='ttt';
  const startLocal = fmtStartLocal(stage);

  panel.innerHTML = `
    <div class="panelhead">
      <div>
        <span class="kicker">${t('stagePrefix')} ${stage.n} · ${fmtDate(stage.dateIso)}</span>
        <h2>${stage.start} → ${stage.finish}</h2>
      </div>
      <span class="typechip">${t('typeLabels')[stage.type]}</span>
    </div>

    <div class="factrow">
      ${startLocal ? `<div class="factcell"><span class="label">${t('factStart')}</span><span class="value">${startLocal}</span></div>` : ''}
      <div class="factcell"><span class="label">${t('factDistance')}</span><span class="value">${fmtKm(stage.km)}</span></div>
      <div class="factcell"><span class="label">${t('factGain')}</span><span class="value">${stage.gain ? fmtGain(stage.gain) : '—'}</span></div>
      <div class="factcell"><span class="label">${t('factClimbs')}</span><span class="value">${(stage.climbs||[]).length}</span></div>
      <div class="factcell"><span class="label">${t('factSprints')}</span><span class="value">${(stage.sprints||[]).length || '—'}</span></div>
    </div>
    ${startLocal ? `<div class="startnote">${t('startNote')}</div>` : ''}

    ${wxSectionHTML(stage)}

    ${mapExpanded ? bigMapBoxHTML(stage) : ''}

    <div class="detailgrid${mapExpanded ? ' big' : ''}">
      ${mapExpanded ? '' : `<div class="mapcell">${mapCellHTML(stage)}</div>`}
      <div class="profilecell">
        <span class="label">${profileLabel()}</span>
        ${renderProfile(stage)}
        <div class="legend">
          <span class="legenditem"><span class="legswatch" style="background:${CAT_COLOR.C1}"></span>${t('legendClimb')}</span>
        </div>
        <span class="chart-caption">${t('chartCaption')}</span>

  bindMapControls(stage);
  initStageMap(stage);

function todayStageIndex(){
  const d = new Date();
  const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let n;
  if(key in STAGE_DATES) n = STAGE_DATES[key];
  else if(key < '2027-07-02') n = 1;
  else n = 21;
  const idx = stages.findIndex(s=>s.n===n);
  return idx >= 0 ? idx : 0;
}

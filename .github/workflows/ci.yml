name: CI

# Fast feedback on pull requests: typecheck/build + unit tests only — no
# scraping, no Pages deploy. That heavier pipeline lives in
# update-results.yml and runs on push to main / schedule.
on:
  pull_request:
    branches: [main]
  # update-results.yml starts this on its bot/data-update branch: a PR opened
  # with GITHUB_TOKEN does not fire pull_request, and main requires `test`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Compiles src/race-page.ts -> dist/race-page.js; fails the job on any
      # type error.
      - name: Build TypeScript
        run: npm run build

      # Unit and page-interaction tests in test/.
      - name: Run tests
        run: npm test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # Network-free tests for the scrapers (fake fetch, saved HTML).
      - name: Run scraper tests
        run: |
          pip install -r scripts/requirements.txt
          python scripts/test_fetch_results.py
          python scripts/test_fetch_riders.py
